<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>No internet · Attendance</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: #fff; color: #171717; text-align: center;
  }
  main { max-width: 22rem; display: grid; gap: 16px; justify-items: center; }
  .icon { width: 96px; height: 96px; border-radius: 50%; background: #fee2e2; display: grid; place-items: center; }
  h1 { margin: 0; font-size: 1.75rem; }
  p { margin: 0; color: #525252; font-size: 1.125rem; line-height: 1.4; }
  button {
    margin-top: 8px; width: 100%; min-height: 64px; border: 0; border-radius: 16px;
    background: #16a34a; color: #fff; font-size: 1.375rem; font-weight: 700;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>No internet</h1>
  <p>Punches can't be saved right now. Check Wi-Fi or mobile data.</p>
  <p lang="hi">इंटरनेट नहीं है। Wi-Fi या मोबाइल डेटा देखें।</p>
  <button type="button" onclick="location.reload()">Try again · फिर से</button>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
